<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TFG Event Graphic — Demo Day Invite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'GT America Extended';
            src: url('./4618gt.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'GT America Extended';
            src: url('./2809gt-bold.woff') format('woff');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Tobias';
            src: url('./Tobias-Thin.woff') format('woff');
            font-weight: 300;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Tobias';
            src: url('./Tobias-Medium.woff') format('woff');
            font-weight: 500;
            font-style: normal;
            font-display: swap;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --green: #4EFF00;
            --green-dim: rgba(78, 255, 0, 0.3);
            --charcoal: #2d2d2d;
            --charcoal-dark: #1a1a1a;
            --charcoal-light: #3a3a3a;
            --white: #ffffff;
            --gray: #888888;
            --gray-dark: #666666;
            --serif: 'Tobias', Georgia, serif;
            --sans: 'GT America Extended', 'Helvetica Neue', sans-serif;
            --mono: 'Roboto Mono', monospace;
        }

        body {
            font-family: var(--sans);
            background: #1a1a1a;
            padding: 40px;
            -webkit-font-smoothing: antialiased;
        }

        .template-label {
            font-family: var(--mono);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--green);
            background: #2d2d2d;
            padding: 10px 16px;
            margin-bottom: 0;
            display: inline-block;
        }

        .template-size {
            font-family: var(--mono);
            font-size: 10px;
            color: #666;
            margin-left: 12px;
        }

        .template-container {
            margin-bottom: 60px;
        }

        .event-graphic {
            width: 960px;
            height: 540px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 40px rgba(0,0,0,0.5);
            margin-top: 0;
        }

        .graphic-inner {
            width: 1920px;
            height: 1080px;
            transform: scale(0.5);
            transform-origin: top left;
            position: relative;
        }

        .demoday-graphic {
            background: var(--charcoal-dark);
            position: relative;
        }

        .demoday-graphic .arc-bg {
            position: absolute;
            bottom: -200px;
            left: -100px;
            width: 800px;
            height: 800px;
            border: 2px solid var(--green-dim);
            border-radius: 50%;
            opacity: 0.4;
        }

        .demoday-graphic .arc-bg-2 {
            position: absolute;
            bottom: -300px;
            left: -200px;
            width: 1000px;
            height: 1000px;
            border: 1px solid var(--green-dim);
            border-radius: 50%;
            opacity: 0.2;
        }

        .demoday-graphic .content-wrapper {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            padding: 80px;
        }

        .demoday-graphic .left-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .demoday-graphic .right-content {
            width: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-end;
            text-align: right;
        }

        .demoday-graphic .logo-area {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .demoday-graphic .logo-circle {
            width: 56px;
            height: 56px;
            border: 6px solid var(--green);
            border-radius: 50%;
        }

        .demoday-graphic .logo-text {
            font-family: var(--mono);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.15em;
            color: var(--green);
            line-height: 1.4;
        }

        .demoday-graphic .main-content {
            max-width: 900px;
        }

        .demoday-graphic .event-type {
            font-family: var(--mono);
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.25em;
            color: var(--green);
            margin-bottom: 20px;
        }

        .demoday-graphic .event-title {
            font-family: var(--serif);
            font-size: 120px;
            font-weight: 500;
            color: var(--white);
            line-height: 1;
            margin-bottom: 16px;
        }

        .demoday-graphic .event-subtitle {
            font-family: var(--serif);
            font-size: 48px;
            font-weight: 300;
            color: var(--green);
            margin-bottom: 32px;
        }

        .demoday-graphic .event-desc {
            font-size: 22px;
            color: var(--gray);
            line-height: 1.5;
        }

        .demoday-graphic .footer-area {
            display: flex;
            align-items: center;
            gap: 48px;
        }

        .demoday-graphic .cta-button {
            background: var(--green);
            color: var(--charcoal-dark);
            font-family: var(--mono);
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.1em;
            padding: 20px 40px;
        }

        .demoday-graphic .event-details {
            font-family: var(--mono);
            font-size: 14px;
            color: var(--gray);
            line-height: 1.8;
        }

        .demoday-graphic .stat-block {
            text-align: right;
        }

        .demoday-graphic .stat-value {
            font-family: var(--serif);
            font-size: 80px;
            color: var(--green);
            line-height: 1;
        }

        .demoday-graphic .stat-label {
            font-family: var(--mono);
            font-size: 12px;
            letter-spacing: 0.15em;
            color: var(--gray);
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="template-container">
        <div class="template-label">Demo Day Invite<span class="template-size">1920 × 1080 PNG</span></div>
        <div class="event-graphic">
            <div class="graphic-inner demoday-graphic">
                <div class="arc-bg"></div>
                <div class="arc-bg-2"></div>

                <div class="content-wrapper">
                    <div class="left-content">
                        <div class="logo-area">
                            <div class="logo-circle"></div>
                            <div class="logo-text">
                                TECH<br>FUTURES<br>GROUP
                            </div>
                        </div>

                        <div class="main-content">
                            <div class="event-type">PITCH EVENT</div>
                            <h1 class="event-title">Demo Day</h1>
                            <div class="event-subtitle">Spring 2025</div>
                            <p class="event-desc">10 founders. 5 minutes each. Real investors in the room.</p>
                        </div>

                        <div class="footer-area">
                            <div class="cta-button">APPLY TO PITCH →</div>
                            <div class="event-details">
                                MARCH 20, 2025<br>
                                5:00 PM · SACRAMENTO
                            </div>
                        </div>
                    </div>

                    <div class="right-content">
                        <div class="stat-block">
                            <div class="stat-value">$1.4B+</div>
                            <div class="stat-label">RAISED BY TFG FOUNDERS</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
