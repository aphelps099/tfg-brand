<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TFG Event Graphic — Pitch Event Green Accent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'GT America Extended';
            src: url('./4618gt.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'GT America Extended';
            src: url('./2809gt-bold.woff') format('woff');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Tobias';
            src: url('./Tobias-Thin.woff') format('woff');
            font-weight: 300;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Tobias';
            src: url('./Tobias-Medium.woff') format('woff');
            font-weight: 500;
            font-style: normal;
            font-display: swap;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --green: #4EFF00;
            --green-dim: rgba(78, 255, 0, 0.3);
            --charcoal: #2d2d2d;
            --charcoal-dark: #1a1a1a;
            --charcoal-light: #3a3a3a;
            --white: #ffffff;
            --gray: #888888;
            --gray-dark: #666666;
            --serif: 'Tobias', Georgia, serif;
            --sans: 'GT America Extended', 'Helvetica Neue', sans-serif;
            --mono: 'Roboto Mono', monospace;
        }

        body {
            font-family: var(--sans);
            background: #1a1a1a;
            padding: 40px;
            -webkit-font-smoothing: antialiased;
        }

        .template-label {
            font-family: var(--mono);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--green);
            background: #2d2d2d;
            padding: 10px 16px;
            margin-bottom: 0;
            display: inline-block;
        }

        .template-size {
            font-family: var(--mono);
            font-size: 10px;
            color: #666;
            margin-left: 12px;
        }

        .template-container {
            margin-bottom: 60px;
        }

        .event-graphic {
            width: 960px;
            height: 540px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 40px rgba(0,0,0,0.5);
            margin-top: 0;
        }

        .graphic-inner {
            width: 1920px;
            height: 1080px;
            transform: scale(0.5);
            transform-origin: top left;
            position: relative;
        }
    </style>
</head>
<body>

    <div class="template-container">
        <div class="template-label">Pitch Event Alt — Green Accent<span class="template-size">1920 × 1080 PNG</span></div>
        <div class="event-graphic">
            <div class="graphic-inner" style="background: #2d2d2d; position: relative;">
                <!-- Green diagonal -->
                <div style="position: absolute; top: 0; right: 0; width: 500px; height: 100%; background: #4EFF00; clip-path: polygon(30% 0, 100% 0, 100% 100%, 0 100%);"></div>

                <!-- Content -->
                <div style="position: relative; z-index: 2; height: 100%; display: flex; padding: 80px;">
                    <div style="flex: 1; display: flex; flex-direction: column; justify-content: space-between;">
                        <div style="display: flex; align-items: center; gap: 14px;">
                            <div style="width: 56px; height: 56px; border: 6px solid #4EFF00; border-radius: 50%;"></div>
                            <div style="font-family: 'Roboto Mono', monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: #4EFF00; line-height: 1.4;">
                                TECH<br>FUTURES<br>GROUP
                            </div>
                        </div>

                        <div style="max-width: 800px;">
                            <div style="font-family: 'Roboto Mono', monospace; font-size: 14px; font-weight: 600; letter-spacing: 0.2em; color: #888; margin-bottom: 16px;">APPLICATIONS OPEN</div>
                            <h1 style="font-family: 'Tobias', Georgia, serif; font-size: 100px; font-weight: 500; color: #fff; line-height: 1; margin-bottom: 20px;">
                                Pitch Night
                            </h1>
                            <p style="font-size: 24px; color: #888; line-height: 1.5; max-width: 600px;">5 founders pitch to a panel of VCs and angels. Get real feedback. Make real connections.</p>
                        </div>

                        <div style="display: flex; align-items: center; gap: 48px;">
                            <div style="background: #4EFF00; color: #2d2d2d; font-family: 'Roboto Mono', monospace; font-size: 16px; font-weight: 700; letter-spacing: 0.1em; padding: 20px 40px;">APPLY NOW →</div>
                            <div style="font-family: 'Roboto Mono', monospace; font-size: 14px; color: #888; line-height: 1.8;">
                                FEBRUARY 28, 2025<br>
                                6:00 PM · CHICO
                            </div>
                        </div>
                    </div>

                    <!-- Right side on green -->
                    <div style="width: 350px; display: flex; flex-direction: column; justify-content: center; align-items: flex-end; padding-right: 40px;">
                        <div style="text-align: right; color: #2d2d2d;">
                            <div style="font-family: 'Tobias', Georgia, serif; font-size: 72px; line-height: 1;">5</div>
                            <div style="font-family: 'Roboto Mono', monospace; font-size: 14px; letter-spacing: 0.1em; margin-top: 8px;">PITCH SLOTS</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
